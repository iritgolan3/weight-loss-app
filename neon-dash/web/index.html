<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Neon Dash</title>
<style>
  :root { --bg:#050816; --panel:#0e1330; --line:#2a3470; --txt:#e8ecff; --dim:#8a93c8; --a:#37e0ff; --b:#ff5fd2; --ok:#3dffb0; --gold:#ffd23d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); }
  .screen.on { display:flex; }
  h1 { margin:0; font-size:min(11vh,64px); letter-spacing:.08em; font-weight:900; text-transform:uppercase; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 14px rgba(55,224,255,.5)); }
  h2 { margin:0 0 8px; font-size:min(6vh,28px); letter-spacing:.06em; text-transform:uppercase; }
  .sub { color:var(--dim); margin:4px 0 14px; font-size:14px; }
  .btn { appearance:none; border:2px solid var(--a); background:rgba(55,224,255,.12); color:var(--txt); font:inherit; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:12px 22px; border-radius:12px; min-height:46px; box-shadow:0 0 14px rgba(55,224,255,.35); }
  .btn:active { transform:scale(.96); background:rgba(55,224,255,.3); }
  .btn.big { font-size:min(6vh,26px); padding:14px 44px; border-color:var(--ok); background:rgba(61,255,176,.14); box-shadow:0 0 18px rgba(61,255,176,.45); }
  .btn.pink { border-color:var(--b); background:rgba(255,95,210,.12); box-shadow:0 0 14px rgba(255,95,210,.35); }
  .btn.small { padding:6px 12px; min-height:34px; font-size:12px; }
  .row { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .top { position:absolute; top:max(8px,env(safe-area-inset-top)); left:max(10px,env(safe-area-inset-left)); right:max(10px,env(safe-area-inset-right)); display:flex; justify-content:space-between; align-items:center; }
  .stats { display:flex; gap:12px; font-weight:800; font-size:14px; }
  .stats span::before { margin-right:4px; }
  .s-star::before { content:"\2605"; color:var(--gold); } .s-orb::before { content:"\25CF"; color:#56a8ff; } .s-dia::before { content:"\25C6"; color:var(--b); } .s-coin::before { content:"\25CE"; color:var(--gold); }

  /* level select */
  #levels .scroller { display:flex; gap:14px; overflow-x:auto; width:100%; padding:10px 6vw; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .card { flex:0 0 min(46vw,230px); scroll-snap-align:center; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:6px; text-align:center; }
  .card.done { border-color:var(--ok); }
  .card .nm { font-weight:900; font-size:17px; }
  .card .df { font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .bar { height:8px; border-radius:6px; background:#1b2354; overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--a),var(--ok)); }
  .coins { letter-spacing:.3em; color:#444b7c; } .coins b { color:var(--gold); }
  .swatch { width:100%; height:44px; border-radius:10px; }

  /* panels */
  .panel { width:min(720px,100%); max-height:78vh; overflow-y:auto; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:14px 16px; -webkit-overflow-scrolling:touch; }
  .panel h3 { margin:14px 0 6px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--a); }
  .panel h3:first-child { margin-top:0; }
  .line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:15px; }
  .line small { color:var(--dim); display:block; font-size:12px; }
  .tog { appearance:none; width:50px; height:28px; border-radius:16px; background:#27305f; position:relative; flex:none; border:0; }
  .tog::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#8a93c8; transition:.15s; }
  .tog.on { background:var(--ok); } .tog.on::after { left:25px; background:#05301f; }
  input[type=range] { width:46%; accent-color:var(--a); }
  input[type=number] { width:110px; background:#0a0e26; color:var(--txt); border:2px solid var(--line); border-radius:8px; padding:6px; font:inherit; font-weight:700; text-align:right; user-select:text; -webkit-user-select:text; }
  .lvrow { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; }
  .cbtn { width:34px; height:34px; border-radius:50%; border:2px solid #3a4380; background:transparent; color:var(--gold); font-size:18px; }
  .cbtn.on { background:rgba(255,210,61,.2); border-color:var(--gold); }

  /* garage */
  .gridpick { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; margin:6px 0 10px; }
  .gridpick canvas { position:static; width:100%; height:auto; aspect-ratio:1; background:#0a0e26; border:2px solid var(--line); border-radius:10px; }
  .gridpick canvas.sel, .gridpick .col.sel { border-color:var(--ok); box-shadow:0 0 10px var(--ok); }
  .gridpick .col { aspect-ratio:1; border-radius:10px; border:2px solid var(--line); }
  #preview { position:static; width:110px; height:110px; background:#0a0e26; border:2px solid var(--line); border-radius:14px; }

  /* hud */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #hud.on { display:block; }
  #progress { position:absolute; top:max(10px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(44vw,360px); height:10px; background:rgba(255,255,255,.14); border-radius:6px; overflow:hidden; }
  #progress i { display:block; height:100%; width:0; background:var(--ok); }
  #pct { position:absolute; top:max(6px,env(safe-area-inset-top)); left:calc(50% + min(22vw,180px) + 10px); font-weight:900; font-size:15px; text-shadow:0 0 6px #000; }
  #hudbtns { position:absolute; top:max(6px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); display:flex; gap:8px; pointer-events:auto; }
  #hudbtns .btn { padding:6px 12px; min-height:36px; font-size:13px; }
  #practiceBtns { position:absolute; bottom:max(10px,env(safe-area-inset-bottom)); left:max(10px,env(safe-area-inset-left)); display:none; gap:8px; pointer-events:auto; }
  #practiceBtns.on { display:flex; }
  #cheatTag { position:absolute; top:max(34px,calc(env(safe-area-inset-top) + 28px)); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.14em; color:var(--b); text-shadow:0 0 6px #000; }
  #msg { position:absolute; top:34%; left:0; right:0; text-align:center; font-size:min(8vh,44px); font-weight:900; text-shadow:0 0 14px var(--a); opacity:0; transition:opacity .3s; }
  #pause, #end { background:rgba(3,5,18,.78); }
  #toast { position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); background:#0e1330; border:2px solid var(--ok); border-radius:12px; padding:8px 16px; font-weight:800; display:none; z-index:50; }
  #rotate { position:fixed; inset:0; background:var(--bg); z-index:60; display:none; align-items:center; justify-content:center; text-align:center; font-size:20px; font-weight:800; padding:30px; }
  @media (orientation:portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="main" class="screen on">
  <div class="top"><div class="stats"><span class="s-star" id="stStar">0</span><span class="s-orb" id="stOrb">0</span><span class="s-dia" id="stDia">0</span><span class="s-coin" id="stCoin">0</span></div><div></div></div>
  <h1>Neon Dash</h1>
  <div class="sub">All levels &amp; icons unlocked &middot; cheat menu included</div>
  <div class="row" style="margin:6px 0 16px"><button class="btn big" data-go="levels">&#9654; Play</button></div>
  <div class="row"><button class="btn" data-go="garage">Garage</button><button class="btn pink" data-go="cheats">Cheats</button></div>
</div>

<div id="levels" class="screen">
  <div class="top"><button class="btn small" data-go="main">&larr; Back</button><div class="stats"><span class="s-star" data-st="star">0</span><span class="s-coin" data-st="coin">0</span></div></div>
  <h2>Select level</h2>
  <div class="scroller" id="cards"></div>
</div>

<div id="garage" class="screen">
  <div class="top"><button class="btn small" data-go="main">&larr; Back</button><div></div></div>
  <div class="panel" style="margin-top:34px">
    <div class="row" style="justify-content:flex-start"><canvas id="preview" width="220" height="220"></canvas><div class="sub" style="margin:0">Everything is unlocked. Tap to choose.</div></div>
    <h3>Cube</h3><div class="gridpick" id="pickCube"></div>
    <h3>Ship</h3><div class="gridpick" id="pickShip"></div>
    <h3>Primary colour</h3><div class="gridpick" id="pickC1"></div>
    <h3>Secondary colour</h3><div class="gridpick" id="pickC2"></div>
  </div>
</div>

<div id="cheats" class="screen">
  <div class="top"><button class="btn small" data-go="main">&larr; Back</button><div></div></div>
  <div class="panel" style="margin-top:34px" id="cheatPanel"></div>
</div>

<div id="hud">
  <div id="progress"><i></i></div><div id="pct">0%</div><div id="cheatTag"></div>
  <div id="hudbtns"><button class="btn" id="btnPause">II</button></div>
  <div id="practiceBtns"><button class="btn small" id="btnCp">+ Checkpoint</button><button class="btn small" id="btnCpDel">- Remove</button></div>
  <div id="msg"></div>
</div>

<div id="pause" class="screen">
  <h2>Paused</h2>
  <div class="row" style="margin-top:6px">
    <button class="btn big" id="pResume">Resume</button>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn" id="pRestart">Restart</button><button class="btn" id="pPractice">Practice: off</button><button class="btn pink" id="pExit">Exit</button></div>
</div>

<div id="end" class="screen">
  <h2 id="endTitle">Level complete!</h2>
  <div class="sub" id="endInfo"></div>
  <div class="row"><button class="btn" id="eAgain">Replay</button><button class="btn big" id="eNext">Next level</button><button class="btn pink" id="eMenu">Menu</button></div>
</div>

<div id="toast"></div>
<div id="rotate">Rotate your phone to landscape</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
