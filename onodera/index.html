<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sushi Ginza Onodera · 3D</title>
<meta name="description" content="מודל תלת-ממדי של Sushi Ginza Onodera ניו יורק (461 Fifth Ave, 2016–2023), נבנה ב-Blender">
<meta name="theme-color" content="#14110d">
<style>
  :root{
    --bg:#14110d; --panel:rgba(24,20,15,.82); --line:rgba(232,211,169,.18);
    --text:#efe6d6; --muted:#b4a68e; --accent:#e8d3a9;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
  @supports (height:100dvh){html,body{height:100dvh}}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  header{position:fixed;top:0;inset-inline:0;padding:14px 16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
    background:linear-gradient(to bottom,rgba(20,17,13,.85),rgba(20,17,13,0))}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
  h1 small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .hint{font-size:11px;color:var(--muted);text-align:start;line-height:1.5;flex:none}
  @media (max-width:480px){ .hint .how{display:none} h1{font-size:15px} }
  footer{position:fixed;bottom:0;inset-inline:0;padding:18px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(20,17,13,.92),rgba(20,17,13,0))}
  .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  button[aria-pressed="true"]{background:var(--accent);color:#2a2116;border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);pointer-events:none}
  #caption{text-align:center;font-size:13px;color:var(--muted);margin:0 0 10px;min-height:1.3em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  a{color:var(--accent)}
  .renders{pointer-events:auto}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <h1>Sushi Ginza Onodera — New York<small>מודל תלת-ממדי שנבנה ב-Blender · <bdi>461 Fifth Ave</bdi> · <bdi>2016–2023</bdi></small></h1>
  <div class="hint"><span class="how">גרירה: סיבוב · צביטה/גלגלת: זום<br>שתי אצבעות: הזזה · </span><a class="renders" href="renders/">רינדורים</a></div>
</header>
<div id="status">טוען מודל…</div>
<footer>
<p id="caption" aria-live="polite"></p>
<nav class="bar" aria-label="מבטים">
  <button data-view="overview" aria-pressed="true">מבט על</button>
  <button data-view="hero">המסעדה</button>
  <button data-view="counter">דלפק ההינוקי</button>
  <button data-view="guest">מושב אורח</button>
  <button data-view="chef">עמדת השף</button>
  <button data-view="tables">שולחנות</button>
  <button data-view="volume">התקרה הכפולה</button>
  <button data-view="entrance">החזית בשדרה החמישית</button>
  <button id="ceiling" aria-pressed="false">תקרה וקיר</button>
</nav>
</footer>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();

const CAPTIONS = {
  overview: 'חתך: התקרה והקיר הדרומי מוסתרים. דלפק L עם 16 מושבים, 4 שולחנות, קוביית הכניסה והמטבח',
  hero: 'דלפק הינוקי בצורת L מול קיר אריחי ביזן',
  counter: 'דלפק מקורת הינוקי אחת, וקיר אריחי קרמיקה בסגנון ביזן מסודרים ברשת כמו שוג׳י',
  guest: 'מה שהאורח רואה מהמושב',
  chef: 'מאחורי הדלפק: עמדות האיטמאה והמקררים בחזית עץ',
  tables: 'ארבעה שולחנות לארבעה, ופס אור חם מאחורי סבכת עץ בגובה כ-3 מ׳',
  volume: 'חלל בגובה כפול (כ-7.5 מ׳) עם חופה מרחפת של רשת הינוקי מעל הדלפק',
  entrance: 'החזית ב-<bdi>461 Fifth Ave</bdi> לפי תמונות <bdi>Street View</bdi>: עמודי אבן, שלט זהב, ידית טבעת מפליז ומסך קומיקו',
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const NIGHT = new THREE.Color(0x14110d), DAY = new THREE.Color(0xb9cfe3);
const scene = new THREE.Scene();
scene.background = NIGHT.clone();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const hemi = new THREE.HemisphereLight(0xfff1dc, 0x2a2016, 0.55);
scene.add(hemi);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

// Blender is Z-up (x, y, z); glTF / three.js is Y-up (x, z, -y).
const b = ([x, y, z]) => new THREE.Vector3(x, z, -y);

// Colour temperature (K) -> RGB, same approximation the Blender build uses.
function kelvin(k) {
  const t = k / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const bl = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  const c = v => Math.min(255, Math.max(0, v)) / 255;
  return new THREE.Color(c(r), c(g), c(bl));
}
function addLights(list) {
  for (const L of list) {
    if (L.type === 'rect') {
      const l = new THREE.RectAreaLight(kelvin(L.k), L.i, L.w, L.h);
      l.position.copy(b(L.pos)); l.lookAt(b(L.look)); scene.add(l);
    } else {
      const l = new THREE.PointLight(kelvin(L.k), L.i, L.d, 2);
      l.position.copy(b(L.pos)); scene.add(l);
    }
  }
}

const VIEWS = {};
const cutaway = [];
let current = null, dayMix = 0, dayTarget = 0;

function go(name, instant) {
  const v = VIEWS[name]; if (!v) return;
  current = name;
  const from = { p: camera.position.clone(), t: controls.target.clone() };
  const to = { p: b(v.pos), t: b(v.target) };
  for (const btn of document.querySelectorAll('[data-view]')) btn.setAttribute('aria-pressed', btn.dataset.view === name);
  setCutaway(!v.ceiling);
  dayTarget = name === 'entrance' ? 1 : 0;
  document.getElementById('caption').innerHTML = CAPTIONS[name] || '';   // static strings above
  if (instant) { camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); return; }
  const t0 = performance.now(), dur = 1100;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(from.p, to.p, e); controls.target.lerpVectors(from.t, to.t, e); controls.update();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function setCutaway(hidden) {
  cutaway.forEach(o => o.visible = !hidden);
  document.getElementById('ceiling').setAttribute('aria-pressed', !hidden);
}
document.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => go(btn.dataset.view));
document.getElementById('ceiling').onclick = e => setCutaway(e.currentTarget.getAttribute('aria-pressed') === 'true');

const json = url => fetch(url).then(r => r.ok ? r.json() : Promise.reject(r.status));
Promise.all([json('views.json'), json('lights.json').catch(() => [])]).then(([views, lights]) => {
  Object.assign(VIEWS, views);
  addLights(lights);
  new GLTFLoader().load('onodera.glb', gltf => {
    const root = gltf.scene;
    root.traverse(o => {
      if (!o.isMesh) return;
      let p = o;
      while (p) { if (/^(Ceiling|Cutaway)/i.test(p.name)) { cutaway.push(o); break; } p = p.parent; }
      const m = o.material;
      if (m && m.transmission > 0) {        // keep glass cheap and see-through on phones
        m.transmission = 0; m.transparent = true; m.opacity = 0.1; m.depthWrite = false; m.roughness = 0.05;
        m.color.multiplyScalar(0.5);
      }
    });
    scene.add(root);
    document.getElementById('status').remove();
    go('overview', true);
  }, xhr => {
    if (xhr.total) document.getElementById('status').textContent = 'טוען מודל… ' + Math.round(100 * xhr.loaded / xhr.total) + '%';
  }, err => { document.getElementById('status').textContent = 'שגיאה בטעינת המודל'; console.error(err); });
}).catch(err => { document.getElementById('status').textContent = 'שגיאה בטעינת הנתונים'; console.error(err); });

// Portrait phones get a wider lens so each preset frames roughly what it does on desktop.
function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 50 + 25 * Math.min(1, (1 - camera.aspect) / 0.5) : 50;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit);
fit();
renderer.setAnimationLoop(() => {
  // street view gets daylight; everything else is the evening service
  dayMix += (dayTarget - dayMix) * 0.06;
  scene.background.copy(NIGHT).lerp(DAY, dayMix);
  hemi.intensity = 0.55 + dayMix * 2.4;
  hemi.color.set(0xfff1dc).lerp(new THREE.Color(0xdfeaff), dayMix);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
