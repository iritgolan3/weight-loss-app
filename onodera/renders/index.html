<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onodera · Renders</title>
<style>
  :root{--bg:#14110d;--text:#efe6d6;--muted:#b4a68e;--accent:#e8d3a9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 16px 8px;max-width:1200px;margin:auto}
  h1{margin:0;font-size:20px;font-weight:600}
  p{margin:6px 0 0;color:var(--muted);font-size:14px}
  a{color:var(--accent)}
  main{max-width:1200px;margin:auto;padding:8px 16px 32px;display:grid;gap:16px}
  figure{margin:0}
  img{width:100%;height:auto;display:block;border-radius:6px;background:#1e1912}
  figcaption{font-size:13px;color:var(--muted);padding:6px 2px 0}
</style>
</head>
<body>
<header>
  <h1>Sushi Ginza Onodera — New York · רינדורים</h1>
  <p>Blender 5.0 · Cycles · <a href="../">לצופה התלת-ממדי</a></p>
</header>
<main>
  <figure><img src="counter.jpg" alt="דלפק ההינוקי וקיר אריחי ביזן" loading="lazy"><figcaption>דלפק מלוח הינוקי אחד וקיר אריחי ביזן</figcaption></figure>
  <figure><img src="hero.jpg" alt="מבט כללי על הדלפק והשולחנות" loading="lazy"><figcaption>דלפק בצורת L עם 16 מושבים, וארבעה שולחנות לארבעה</figcaption></figure>
  <figure><img src="tables.jpg" alt="השולחנות והחלל הגבוה" loading="lazy"><figcaption>החלל בגובה כפול ופס האור מאחורי סבכת העץ</figcaption></figure>
  <figure><img src="volume.jpg" alt="התקרה הכפולה" loading="lazy"><figcaption>חופת ההינוקי המרחפת מעל הדלפק</figcaption></figure>
  <figure><img src="guest.jpg" alt="מבט מהמושב" loading="lazy"><figcaption>מה שהאורח רואה</figcaption></figure>
  <figure><img src="chef.jpg" alt="עמדת השף" loading="lazy"><figcaption>מאחורי הדלפק</figcaption></figure>
  <figure><img src="overview.jpg" alt="חתך מלמעלה" loading="lazy"><figcaption>חתך: התקרה והקיר הדרומי הוסרו</figcaption></figure>
  <figure><img src="entrance.jpg" alt="החזית בשדרה החמישית" loading="lazy"><figcaption>החזית ב-<bdi>461 Fifth Ave</bdi></figcaption></figure>
</main>
</body>
</html>
