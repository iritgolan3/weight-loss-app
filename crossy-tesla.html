<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crossy Tesla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #7ec8e3; }
  * { box-sizing: border-box; }
  body {
    font-family: Archivo, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; background: #7ec8e3; }
  .host { position: absolute; inset: 0; }
  .host canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
  .hud-left { top: calc(16px + env(safe-area-inset-top)); left: calc(22px + env(safe-area-inset-left)); }
  .hud-right { top: calc(20px + env(safe-area-inset-top)); right: calc(22px + env(safe-area-inset-right)); text-align: right; }
  .score { font: 900 54px/1 Archivo, sans-serif; color: #fff; letter-spacing: -.03em; text-shadow: 0 4px 0 rgba(0,0,0,.22); }
  .best { font: 900 24px/1 Archivo, sans-serif; color: rgba(255,255,255,.95); letter-spacing: -.02em; }
  .label { font: 500 10px/1 'JetBrains Mono', monospace; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.9); }
  .label-dim { color: rgba(255,255,255,.75); }

  .back {
    position: absolute; left: calc(20px + env(safe-area-inset-left));
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 40px; height: 40px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.22); color: #fff; text-decoration: none;
    font: 700 18px/1 Archivo, sans-serif; backdrop-filter: blur(4px);
  }
  .back:hover { background: rgba(255,255,255,.34); }

  .hint {
    position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; pointer-events: none;
    font: 500 10px/1.6 'JetBrains Mono', monospace; letter-spacing: .2em;
    text-transform: uppercase; color: rgba(255,255,255,.78);
  }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(9,26,38,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .card {
    width: min(420px, 100%); background: #f4f1e9; border-radius: 26px;
    padding: 34px 32px 30px; box-shadow: 0 30px 70px rgba(6,20,30,.4); text-align: center;
    animation: ctIn .32s cubic-bezier(.22,1,.36,1);
  }
  .kicker { font: 500 10px/1 'JetBrains Mono', monospace; letter-spacing: .28em; text-transform: uppercase; color: #8a8a8a; }
  .title { font: 900 clamp(34px,6vw,46px)/1.02 Archivo, sans-serif; letter-spacing: -.04em; color: #0D0D0D; margin: 14px 0 0; }
  .body { font: 400 14.5px/1.6 Archivo, sans-serif; color: #4A4A4A; margin: 12px 0 0; text-wrap: pretty; }
  .stats { display: flex; gap: 10px; margin: 22px 0 0; }
  .stats[hidden] { display: none; }
  .stat { flex: 1; background: #fff; border-radius: 16px; padding: 14px 10px; }
  .stat-num { font: 900 30px/1 Archivo, sans-serif; letter-spacing: -.03em; color: #0D0D0D; }
  .stat-label { font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #8a8a8a; margin-top: 6px; }
  .play {
    margin: 24px 0 0; width: 100%; border: 0; cursor: pointer; background: #0D0D0D; color: #f4f1e9;
    border-radius: 999px; padding: 16px 20px;
    font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .24em; text-transform: uppercase;
  }
  .play:hover { opacity: .84; }
  .spinner { margin: 24px 0 0; font: 500 10px/1 'JetBrains Mono', monospace; letter-spacing: .24em; text-transform: uppercase; color: #8a8a8a; animation: ctBlink 1.1s ease-in-out infinite; }

  /* ---- editor ---- */
  .pencil {
    position: absolute; z-index: 5;
    top: calc(18px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 999px; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.24); color: #fff; font-size: 19px; line-height: 1;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .16s ease, color .16s ease;
  }
  .pencil:hover { background: rgba(255,255,255,.4); }
  .pencil[aria-expanded="true"] { background: #0D0D0D; color: #f4f1e9; }

  .editor { position: absolute; z-index: 6; top: 0; right: 0; height: 100%; width: min(370px, 100%); padding: 16px; display: flex; }
  .editor[hidden] { display: none; }
  .editor-in {
    width: 100%; display: flex; flex-direction: column; overflow: hidden;
    background: #f4f1e9; border-radius: 24px; box-shadow: 0 24px 60px rgba(6,20,30,.34);
    animation: ctIn .26s cubic-bezier(.22,1,.36,1);
  }
  .ed-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 14px; }
  .ed-title { font: 900 24px/1 Archivo, sans-serif; letter-spacing: -.03em; color: #0D0D0D; }
  .ed-sub { font: 500 9px/1.5 'JetBrains Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #8a8a8a; margin-top: 7px; }
  .ed-x { border: 0; background: #e7e3d9; color: #0D0D0D; width: 30px; height: 30px; border-radius: 999px; cursor: pointer; font: 600 14px/1 Archivo, sans-serif; flex: none; }
  .ed-x:hover { background: #dbd6c9; }

  .ed-body { flex: 1; overflow-y: auto; padding: 0 16px 4px; }
  .ed-sec { font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #8a8a8a; margin: 6px 2px 9px; }
  .ed-sec + .ed-sec, .ed-list + .ed-sec { margin-top: 18px; }
  .ed-models { display: flex; flex-direction: column; gap: 8px; }
  .ed-list { display: flex; flex-direction: column; gap: 10px; }

  .slot { background: #fff; border-radius: 16px; padding: 11px 13px 13px; }
  .slot.busy { opacity: .55; }
  .slot-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .slot-name { font: 600 12px/1 Archivo, sans-serif; color: #0D0D0D; flex: none; }
  .slot-state { font: 400 10px/1.4 'JetBrains Mono', monospace; color: #8a8a8a; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.bad .slot-state { color: #c0392b; }
  .slot-btns { display: flex; gap: 6px; margin-top: 10px; }
  .slot-btns .icon-btn { flex: 1; padding: 8px 6px; }
  .ed-empty { font: 400 13px/1.5 Archivo, sans-serif; color: #8a8a8a; text-align: center; padding: 22px 10px; }

  .lane { background: #fff; border-radius: 18px; padding: 12px 14px 14px; }
  .lane.off { opacity: .5; }
  .lane-top { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .lane-kind {
    flex: 1; min-width: 0; border: 0; background: #f4f1e9; border-radius: 9px; cursor: pointer;
    padding: 7px 9px; font: 600 12px/1 Archivo, sans-serif; color: #0D0D0D;
  }
  .icon-btn { border: 0; background: #f4f1e9; border-radius: 9px; cursor: pointer; padding: 7px 9px; font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #4A4A4A; }
  .icon-btn:hover { background: #e7e3d9; }
  .icon-btn.on { background: #0D0D0D; color: #f4f1e9; }

  .ctrl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; margin-top: 11px; }
  .ctrl-name { font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #8a8a8a; }
  .ctrl-val { font: 700 12px/1 Archivo, sans-serif; color: #0D0D0D; font-variant-numeric: tabular-nums; }
  .ctrl input { grid-column: 1 / -1; width: 100%; accent-color: #0D0D0D; margin: 5px 0 0; }

  .ed-foot { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .ed-btn { flex: 1; border: 0; cursor: pointer; border-radius: 999px; padding: 14px 12px; font: 600 10px/1 'JetBrains Mono', monospace; letter-spacing: .18em; text-transform: uppercase; }
  .ed-btn.primary { background: #0D0D0D; color: #f4f1e9; }
  .ed-btn.ghost { background: #e7e3d9; color: #0D0D0D; }
  .ed-btn:hover { opacity: .84; }

  @media (max-width: 760px) {
    .editor { top: auto; bottom: 0; height: auto; max-height: 64vh; width: 100%; padding: 10px; }
    .hint { display: none; }
  }

  @keyframes ctIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes ctBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="stage">
  <div class="host" id="host"></div>

  <div class="hud hud-left">
    <div class="score" id="score">0</div>
    <div class="label">Steps</div>
  </div>

  <div class="hud hud-right">
    <div class="best" id="best">0</div>
    <div class="label label-dim">Best</div>
  </div>

  <a class="back" href="index.html" aria-label="Back to the app">&#8592;</a>
  <div class="hint" id="hint"></div>

  <button class="pencil" id="pencil" aria-expanded="false" aria-controls="editor" title="Edit the traffic (E)">&#9998;</button>

  <div class="editor" id="editor" hidden>
    <div class="editor-in">
      <div class="ed-head">
        <div>
          <div class="ed-title">Traffic</div>
          <div class="ed-sub">Speed &middot; level &middot; how often</div>
        </div>
        <button class="ed-x" id="edClose" title="Close">&#10005;</button>
      </div>
      <div class="ed-body">
        <div class="ed-sec">Models</div>
        <div class="ed-models" id="edModels"></div>
        <div class="ed-sec">Lanes</div>
        <div class="ed-list" id="edList"></div>
      </div>
      <input type="file" id="edFile" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden>
      <div class="ed-foot">
        <button class="ed-btn ghost" id="edReset">Reset</button>
        <button class="ed-btn primary" id="edAdd">Add lane</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="card">
      <div class="kicker" id="cardKicker"></div>
      <div class="title" id="cardTitle"></div>
      <p class="body" id="cardBody"></p>
      <div class="stats" id="cardStats" hidden>
        <div class="stat"><div class="stat-num" id="statScore">0</div><div class="stat-label">Steps</div></div>
        <div class="stat"><div class="stat-num" id="statBest">0</div><div class="stat-label">Best</div></div>
      </div>
      <button class="play" id="cardButton" hidden></button>
      <div class="spinner" id="cardSpinner" hidden></div>
    </div>
  </div>
</div>

<script type="module">
/*
 * Crossy Tesla — hop across Tesla traffic without getting flattened.
 *
 * Standalone page: open crossy-tesla.html over http(s) (module imports need it).
 * three.js r160 is vendored in ./vendor so the game runs offline, with no CDN.
 * See vendor/three-LICENSE.txt (MIT) for three.js and GLTFLoader.
 */
const COLS = 4;              // playable columns each side of centre
const EDGE = COLS + 2;       // world half-width (cars spawn/despawn beyond)
const HOP_MS = 130;
const VIEW_W = 8.6;          // world units that always fit across the screen
const VIEW_H = 9.4;          // world units that always fit down the screen
const AHEAD_MIN = 16;        // rows kept built in front of the player
const BEHIND_MIN = 9;        // rows kept built behind the player
const FALL_MS = 520;         // how long the knocked-over tumble takes

// Everything that can occupy a lane. `gap` is the clear space left between two
// of them, `lane` picks the surface the lane is paved with.
const KINDS = {
  m3:     { label: 'Model 3',    len: 1.8,  gap: 5.4, lane: 'road', swatch: '#2d5f8b' },
  my:     { label: 'Model Y',    len: 1.95, gap: 5.4, lane: 'road', swatch: '#2f7d52' },
  cyber:  { label: 'Cybertruck', len: 2.6,  gap: 6.2, lane: 'road', swatch: '#b9bfc6' },
  truck:  { label: 'Semi truck', len: 4.3,  gap: 9.0, lane: 'road', swatch: '#c0392b' },
  person: { label: 'Pedestrian', len: 0.5,  gap: 2.0, lane: 'walk', swatch: '#f0c9a8' }
};
const KIND_IDS = Object.keys(KINDS);

// Slots a .glb can be dropped into. `fit` says which measurement is matched to
// `base`: people and the character are sized by height, vehicles by length.
const SLOTS = [
  { id: 'player', label: 'Character',  fit: 'height', base: 1.38 },
  { id: 'person', label: 'Pedestrian', fit: 'height', base: 1.2 },
  { id: 'm3',     label: 'Model 3',    fit: 'length', base: KINDS.m3.len },
  { id: 'my',     label: 'Model Y',    fit: 'length', base: KINDS.my.len },
  { id: 'cyber',  label: 'Cybertruck', fit: 'length', base: KINDS.cyber.len },
  { id: 'truck',  label: 'Semi truck', fit: 'length', base: KINDS.truck.len }
];
const SLOT_BY_ID = {};
for (const sl of SLOTS) SLOT_BY_ID[sl.id] = sl;
const LOOK_KEY = 'crossyTeslaLook';
const MODEL_DB = 'crossyTeslaModels';

// speed is world units per second, level is the score the lane first shows up at,
// often is its weight when a lane is rolled.
const DEFAULT_TRAFFIC = [
  { kind: 'm3',     speed: 3.0, level: 0,  often: 1.2, on: true },
  { kind: 'my',     speed: 2.7, level: 0,  often: 1.2, on: true },
  { kind: 'cyber',  speed: 4.2, level: 4,  often: 0.9, on: true },
  { kind: 'truck',  speed: 2.2, level: 10, often: 0.7, on: true },
  { kind: 'person', speed: 1.1, level: 6,  often: 0.6, on: true }
];
const TRAFFIC_KEY = 'crossyTeslaTraffic';
const SPLATS = 64;           // red squares thrown out on impact
const GRAVITY = 15;

// The main character. When this .glb is present it is used; if it is missing or
// fails to load the game falls back to the voxel stand-in, so the page never
// breaks. DRIVER_YAW corrects models that are not authored facing -z.
const DRIVER_MODEL = './assets/elon.glb';
const DRIVER_YAW = 0;
const DRIVER_HEIGHT = 1.38;  // world units from feet to head

const $ = (id) => document.getElementById(id);

const CARDS = {
  loading: { kicker: 'Crossy Tesla', title: 'Warming up', body: 'Building the world out of blocks. This takes a moment the first time.', button: '', stats: false, btn: false, spin: true },
  ready:   { kicker: 'Crossy Tesla', title: 'Cross the road', body: 'Hop forward through Model 3, Model Y and Cybertruck traffic. One hit and it is over.', button: 'Start hopping', stats: false, btn: true, spin: false },
  over:    { kicker: 'Flattened', title: 'Run over', body: 'A Tesla is quiet. That was the problem.', button: 'Try again', stats: true, btn: true, spin: false },
  error:   { kicker: 'Crossy Tesla', title: 'No engine', body: 'The 3D engine could not start. Your browser may not support WebGL.', button: 'Reload', stats: false, btn: true, spin: false }
};

// Orthographic half-extents that keep at least VIEW_W x VIEW_H visible on any aspect.
function frustum(w, h) {
  const aspect = (w || 1) / (h || 1);
  let dx = VIEW_W / 2, dy = VIEW_H / 2;
  if (dx / dy < aspect) dx = dy * aspect; else dy = dx / aspect;
  // How far the screen corners reach along the row axis, for this camera tilt:
  // a wider or taller view sees more world, and unbuilt rows would show as bare sky.
  const reach = Math.min(26, Math.ceil(1.26 * dy + 0.59 * dx) + 2);
  // Cars must be recycled beyond the widest visible x, or they pop in mid-screen.
  const lim = Math.min(34, Math.max(EDGE + 4, 0.82 * dx + 0.9 * dy + 4));
  return { dx: dx, dy: dy, behind: Math.max(BEHIND_MIN, reach), ahead: Math.max(AHEAD_MIN, reach + 4), lim: lim };
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// Uploaded models live in IndexedDB — they are far too big for localStorage.
function idb() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(MODEL_DB, 1);
    rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('models')) rq.result.createObjectStore('models'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

function idbRun(mode, fn) {
  return idb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction('models', mode);
    const rq = fn(tx.objectStore('models'));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}

const store = {
  get: (k) => idbRun('readonly', (s) => s.get(k)).catch(() => null),
  keys: () => idbRun('readonly', (s) => s.getAllKeys()).catch(() => []),
  put: (k, v) => idbRun('readwrite', (s) => s.put(v, k)).catch(() => null),
  del: (k) => idbRun('readwrite', (s) => s.delete(k)).catch(() => null)
};

function niceSize(n) {
  if (!n) return '';
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(n / 1024)) + ' KB';
}

function fmt(key, v) {
  if (key === 'speed') return v.toFixed(1);
  if (key === 'level') return v === 0 ? 'Start' : 'Lv ' + v;
  if (key === 'size') return '\u00d7' + v.toFixed(2);
  if (key === 'yaw') return Math.round(v) + '\u00b0';
  return Math.round(v * 50) + '%';
}

function ctrlRow(key, name, val, min, max, step, shown, attr) {
  return '<div class="ctrl">' +
      '<span class="ctrl-name">' + name + '</span>' +
      '<span class="ctrl-val" data-val="' + key + '">' + shown + '</span>' +
      '<input type="range" data-' + (attr || 'key') + '="' + key + '" min="' + min + '" max="' + max +
        '" step="' + step + '" value="' + val + '" aria-label="' + name + '">' +
    '</div>';
}

function lerpAngle(a, b, k) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * k;
}

class Game {
  constructor() {
    this.state = { phase: 'loading', score: 0, best: 0, progress: 'Building the world' };
    this.host = $('host');
    try { this.best = Number(localStorage.getItem('crossyTeslaBest') || 0) || 0; } catch (e) { this.best = 0; }
    this.state.best = this.best;

    this.traffic = this.loadTraffic();
    this.models = {};
    this.look = this.loadLook();
    this.slotState = {};
    this.pickSlot = null;
    this.editing = false;
    this.pan = { x: 0, y: 0 };

    window.addEventListener('keydown', (e) => this.key(e));
    window.addEventListener('resize', () => this.resize());
    $('cardButton').addEventListener('click', () => {
      if (this.state.phase === 'error') { location.reload(); return; }
      this.play();
    });
    $('pencil').addEventListener('click', () => this.setEditor(!this.editing));
    $('edClose').addEventListener('click', () => this.setEditor(false));
    $('edAdd').addEventListener('click', () => this.addLane());
    $('edReset').addEventListener('click', () => this.resetTraffic());
    $('edList').addEventListener('input', (e) => this.onLaneInput(e));
    $('edList').addEventListener('change', (e) => this.onLaneInput(e));
    $('edList').addEventListener('click', (e) => this.onLaneClick(e));
    $('edModels').addEventListener('click', (e) => this.onModelClick(e));
    $('edModels').addEventListener('input', (e) => this.onModelInput(e));
    $('edFile').addEventListener('change', (e) => this.onModelFile(e.target.files && e.target.files[0]));

    this.renderModels();
    this.renderEditor();
    this.render();
    this.boot();
  }

  setState(patch) {
    Object.assign(this.state, patch);
    this.render();
  }

  render() {
    const s = this.state;
    const phase = s.phase;
    const card = CARDS[phase] || { kicker: '', title: '', body: '', button: '', stats: false, btn: false, spin: false };

    $('score').textContent = s.score;
    $('best').textContent = s.best;
    $('statScore').textContent = s.score;
    $('statBest').textContent = s.best;
    $('hint').textContent = phase === 'play'
      ? 'Arrows / WASD to hop · pencil to edit the traffic'
      : 'Space to start · pencil to edit the traffic';

    $('overlay').hidden = phase === 'play' || this.editing;
    $('cardKicker').textContent = card.kicker;
    $('cardTitle').textContent = card.title;
    $('cardBody').textContent = card.body;
    $('cardStats').hidden = !card.stats;
    $('cardButton').hidden = !card.btn;
    $('cardButton').textContent = card.button;
    $('cardSpinner').hidden = !card.spin;
    $('cardSpinner').textContent = s.progress;
  }

  // ---------- setup ----------

  async boot() {
    let T;
    try {
      T = await import('three');
    } catch (e) {
      console.error('[game] three.js failed to start', e);
      this.setState({ phase: 'error' });
      return;
    }
    this.T = T;
    const host = this.host;
    const w = host.clientWidth || window.innerWidth;
    const h = host.clientHeight || window.innerHeight;

    const renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    renderer.outputColorSpace = T.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.domElement.style.cssText = 'width:100%;height:100%;display:block';
    host.appendChild(renderer.domElement);
    this.renderer = renderer;

    const scene = new T.Scene();
    scene.background = new T.Color(0x7ec8e3);
    scene.fog = new T.Fog(0x7ec8e3, 26, 46);
    this.scene = scene;

    const f = frustum(w, h);
    this.behind = f.behind;
    this.ahead = f.ahead;
    this.lim = f.lim;
    const cam = new T.OrthographicCamera(-f.dx, f.dx, f.dy, -f.dy, -80, 260);
    this.camOff = new T.Vector3(5.6, 8.2, 7.8);
    this.camFace = Math.atan2(5.6, 7.8);
    cam.position.copy(this.camOff);
    cam.lookAt(0, 0, 0);
    this.camera = cam;
    this.camAim = new T.Vector3(0, 0, 0);

    scene.add(new T.HemisphereLight(0xdff3ff, 0x6f8f5a, 0.85));
    const sun = new T.DirectionalLight(0xfff6e2, 1.55);
    sun.position.set(9, 18, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    const s = sun.shadow.camera;
    s.left = -16; s.right = 16; s.top = 16; s.bottom = -16; s.near = 1; s.far = 70;
    sun.shadow.bias = -0.0012;
    scene.add(sun);
    scene.add(sun.target);
    this.sun = sun;
    scene.add(new T.DirectionalLight(0xffffff, 0.25).translateOnAxis(new T.Vector3(-1, 0.4, -1).normalize(), 10));

    this.mats = {};
    this.geos = {};
    this.rows = new Map();
    this.player = new T.Group();
    scene.add(this.player);

    await this.restoreModels();
    if (Object.keys(this.models).some((k) => k !== 'player')) await this.cloner();
    await this.loadDriver();
    this.renderModels();
    this.bindTouch();

    this.reset();
    this.setState({ phase: 'ready' });
    this.last = performance.now();
    this.loop();
  }

  mat(color) {
    if (!this.mats[color]) {
      this.mats[color] = new this.T.MeshLambertMaterial({ color: color, flatShading: true });
    }
    return this.mats[color];
  }

  box(sx, sy, sz) {
    const key = [sx, sy, sz].join('_');
    if (!this.geos[key]) this.geos[key] = new this.T.BoxGeometry(sx, sy, sz);
    return this.geos[key];
  }

  mesh(sx, sy, sz, color, x, y, z) {
    const m = new this.T.Mesh(this.box(sx, sy, sz), this.mat(color));
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }

  // ---------- player ----------

  // Uses the DRIVER_MODEL .glb when one is configured, otherwise a voxel stand-in.
  async loadDriver() {
    const rig = new this.T.Group();
    this.player.add(rig);
    this.rig = rig;
    // A model uploaded through the panel wins; otherwise try the bundled file.
    if (!this.models.player && DRIVER_MODEL) {
      try {
        this.setState({ progress: 'Loading the driver' });
        const gltf = await this.fetchGLB(DRIVER_MODEL);
        this.models.player = this.prepModel(gltf.scene, 'player', gltf.animations, { name: 'elon.glb', bytes: 0, bundled: true });
      } catch (e) { /* falls back to the voxel character */ }
    }
    this.applyDriver();
  }

  applyDriver() {
    const rig = this.rig;
    if (!rig) return;
    while (rig.children.length) rig.remove(rig.children[0]);
    this.mixer = null;
    const m = this.models.player;
    if (m) {
      rig.add(m.root);
      if (m.clips && m.clips.length) {
        this.mixer = new this.T.AnimationMixer(m.root);
        this.mixer.clipAction(m.clips[0]).play();
      }
    } else {
      rig.add(this.voxelGuy());
    }
  }

  // ---------- .glb handling ----------

  async gltfLoader() {
    if (this._loader) return this._loader;
    const { GLTFLoader } = await import('./vendor/addons/loaders/GLTFLoader.js');
    const loader = new GLTFLoader();
    // Optional decoders: a model that does not use them loads fine without these.
    try {
      const { DRACOLoader } = await import('./vendor/addons/loaders/DRACOLoader.js');
      const draco = new DRACOLoader();
      draco.setDecoderPath('./vendor/draco/');
      loader.setDRACOLoader(draco);
    } catch (e) {}
    try {
      const { MeshoptDecoder } = await import('./vendor/meshopt_decoder.module.js');
      loader.setMeshoptDecoder(MeshoptDecoder);
    } catch (e) {}
    this._loader = loader;
    return loader;
  }

  async cloner() {
    if (!this._clone) {
      const mod = await import('./vendor/addons/utils/SkeletonUtils.js');
      this._clone = mod.clone;
    }
    return this._clone;
  }

  fetchGLB(url) {
    return this.gltfLoader().then((loader) => new Promise((res, rej) => loader.load(url, res, undefined, rej)));
  }

  parseGLB(buf) {
    return this.gltfLoader().then((loader) => new Promise((res, rej) => loader.parse(buf, '', res, rej)));
  }

  // Centre the model on its lane, stand it on the ground and match it to the
  // size the game expects, with the slot's own size and turn applied.
  prepModel(raw, slotId, clips, meta) {
    const T = this.T;
    const slot = SLOT_BY_ID[slotId];
    const look = this.look[slotId] || { size: 1, yaw: 0 };
    const wrap = new T.Group();
    raw.position.set(0, 0, 0);
    raw.scale.set(1, 1, 1);
    raw.rotation.set(0, (look.yaw || 0) * Math.PI / 180, 0);
    wrap.add(raw);

    const box = new T.Box3().setFromObject(wrap);
    const size = box.getSize(new T.Vector3());
    const target = slot.base * (look.size || 1);
    const from = slot.fit === 'height' ? size.y : Math.max(size.x, size.z);
    wrap.scale.setScalar(target / Math.max(from, 0.0001));

    const b2 = new T.Box3().setFromObject(wrap);
    const c2 = b2.getCenter(new T.Vector3());
    wrap.position.set(-c2.x, -b2.min.y, -c2.z);
    wrap.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });

    return {
      root: wrap,
      raw: raw,
      clips: clips || [],
      len: Math.max(0.35, b2.max.x - b2.min.x),
      name: (meta && meta.name) || 'model.glb',
      bytes: (meta && meta.bytes) || 0,
      bundled: !!(meta && meta.bundled)
    };
  }

  // Read every model the player has stored, before the first frame is drawn.
  async restoreModels() {
    let keys = [];
    try { keys = await store.keys(); } catch (e) { return; }
    for (const key of keys) {
      if (!SLOT_BY_ID[key]) continue;
      try {
        const rec = await store.get(key);
        if (!rec || !rec.buf) continue;
        this.setState({ progress: 'Loading ' + SLOT_BY_ID[key].label.toLowerCase() });
        const gltf = await this.parseGLB(rec.buf.slice(0));
        this.models[key] = this.prepModel(gltf.scene, key, gltf.animations, { name: rec.name, bytes: rec.size });
      } catch (e) {
        console.warn('[game] could not restore the model for ' + key, e);
      }
    }
  }

  async installModel(slotId, buf, name, bytes) {
    const gltf = await this.parseGLB(buf.slice(0));
    const old = this.models[slotId];
    if (old && old.root.parent) old.root.parent.remove(old.root);
    this.models[slotId] = this.prepModel(gltf.scene, slotId, gltf.animations, { name: name, bytes: bytes });
    if (slotId !== 'player') await this.cloner();
    this.afterModelChange(slotId);            // show it before the write finishes
    await store.put(slotId, { name: name, size: bytes, buf: buf });
  }

  async clearModel(slotId) {
    const m = this.models[slotId];
    if (m && m.root.parent) m.root.parent.remove(m.root);
    delete this.models[slotId];
    await store.del(slotId);
    this.afterModelChange(slotId);
  }

  // Re-fit an already loaded model after its size or turn changed.
  reprepModel(slotId) {
    const m = this.models[slotId];
    if (!m) return;
    if (m.root.parent) m.root.parent.remove(m.root);
    this.models[slotId] = this.prepModel(m.raw, slotId, m.clips, { name: m.name, bytes: m.bytes, bundled: m.bundled });
    this.afterModelChange(slotId, true);
  }

  afterModelChange(slotId, keepPanel) {
    if (slotId === 'player') this.applyDriver();
    else this.applyTraffic();
    if (!keepPanel) this.renderModels();
  }

  voxelGuy() {
    const g = new this.T.Group();
    g.add(this.mesh(0.24, 0.3, 0.2, 0x23252b, -0.1, 0.15, 0));
    g.add(this.mesh(0.24, 0.3, 0.2, 0x23252b, 0.1, 0.15, 0));
    g.add(this.mesh(0.5, 0.42, 0.32, 0x1b1d22, 0, 0.51, 0));
    g.add(this.mesh(0.1, 0.3, 0.1, 0xf0c9a8, -0.3, 0.55, 0));
    g.add(this.mesh(0.1, 0.3, 0.1, 0xf0c9a8, 0.3, 0.55, 0));
    g.add(this.mesh(0.36, 0.32, 0.3, 0xf0c9a8, 0, 0.88, 0));
    g.add(this.mesh(0.38, 0.1, 0.32, 0x3a2a1c, 0, 1.06, 0));
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    return g;
  }

  // ---------- world ----------

  reset() {
    for (const row of this.rows.values()) this.scene.remove(row.group);
    this.rows.clear();
    this.px = 0;
    this.prow = 0;
    this.score = 0;
    this.hopT = null;
    this.face = 0;
    this.clearSplatter();
    this.deathT = null;
    this.player.position.set(0, 0.08, 0);
    this.player.rotation.y = 0;
    this.rig.rotation.set(0, this.camFace, 0);
    this.rig.scale.set(1, 1, 1);
    for (let i = -this.behind; i <= this.ahead; i++) this.buildRow(i, i <= 2 ? 'grass' : null);
    this.setState({ score: 0 });
    this.camAim.set(0, 0, 0);
    this.syncCamera(1);
  }

  buildRow(index, force) {
    if (this.rows.has(index)) return;
    const T = this.T;
    const g = new T.Group();
    g.position.z = -index;

    let type = force;
    if (!type) {
      const prev = this.rows.get(index - 1);
      const run = prev && prev.type === 'road' ? prev.run : 0;
      const roadChance = Math.min(0.72, 0.44 + this.score * 0.004);
      if (run >= 3) type = 'grass';
      else if (run > 0) type = Math.random() < 0.62 ? 'road' : 'grass';
      else type = Math.random() < roadChance ? 'road' : 'grass';
    }

    // A road row needs a lane that has reached its level; if none has, it stays grass.
    let entry = null;
    if (type === 'road') {
      entry = this.pickLane();
      if (!entry) type = 'grass';
    }

    const row = { type: type, group: g, cars: [], blockers: new Set(), run: 0, kind: null };

    if (type === 'grass') {
      const shade = (index % 2 === 0) ? 0x7cc35a : 0x74ba52;
      const ground = this.mesh(76, 0.6, 1, shade, 0, -0.22, 0);
      ground.receiveShadow = true;
      g.add(ground);
      const trees = Math.random() < 0.62 ? 1 + Math.floor(Math.random() * 3) : 0;
      for (let n = 0; n < trees; n++) {
        const col = Math.round((Math.random() * 2 - 1) * COLS);
        if (index >= -1 && index <= 2 && Math.abs(col) < 2) continue;
        if (row.blockers.has(col)) continue;
        row.blockers.add(col);
        g.add(this.tree(col));
      }
      for (const side of [-1, 1]) {
        for (let k = COLS + 1; k <= EDGE + 3; k++) {
          if (Math.random() < 0.55) g.add(this.tree(side * k, true));
        }
      }
    } else {
      const prev = this.rows.get(index - 1);
      row.run = prev && prev.type === 'road' ? prev.run + 1 : 1;
      const spec = KINDS[entry.kind];
      const walk = spec.lane === 'walk';
      row.kind = entry.kind;
      const ground = this.mesh(76, 0.6, 1, walk ? 0x9fa6a6 : 0x4b4b55, 0, -0.3, 0);
      ground.receiveShadow = true;
      g.add(ground);
      if (walk) {
        for (let x = -EDGE - 4; x <= EDGE + 4; x += 1.1) {
          g.add(this.mesh(0.86, 0.02, 0.86, 0xacb3b2, x, 0.005, 0));
        }
      } else {
        for (let x = -EDGE - 2; x <= EDGE + 2; x += 2) {
          g.add(this.mesh(0.9, 0.02, 0.07, 0xf2efe4, x, 0.005, 0.5));
        }
      }
      row.dir = Math.random() < 0.5 ? 1 : -1;
      row.speed = Math.max(0.2, entry.speed) * (0.92 + Math.random() * 0.16);
      let x = -this.lim - Math.random() * 6;
      while (x < this.lim + 4) {
        const actor = this.buildActor(entry.kind);
        actor.position.set(x, 0, walk ? (Math.random() - 0.5) * 0.4 : 0);
        actor.rotation.y = row.dir > 0 ? 0 : Math.PI;
        g.add(actor);
        row.cars.push(actor);
        x += actor.userData.len + spec.gap + Math.random() * (walk ? 1.6 : 4.5);
      }
    }

    this.scene.add(g);
    this.rows.set(index, row);
  }

  tree(col, decor) {
    const g = new this.T.Group();
    const h = 0.55 + Math.random() * 0.7;
    const trunk = this.mesh(0.22, 0.5, 0.22, 0x6b4a2c, 0, 0.25, 0);
    trunk.castShadow = true;
    g.add(trunk);
    const leaf = this.mesh(0.72, h, 0.72, decor ? 0x3f8a3a : 0x46993f, 0, 0.5 + h / 2, 0);
    leaf.castShadow = true;
    g.add(leaf);
    const cap = this.mesh(0.5, 0.36, 0.5, 0x50a848, 0, 0.5 + h + 0.14, 0);
    cap.castShadow = true;
    g.add(cap);
    g.position.set(col, 0.08, (Math.random() - 0.5) * 0.14);
    g.scale.setScalar(0.9 + Math.random() * 0.25);
    return g;
  }

  buildActor(kind) {
    const m = this.models[kind];
    if (m && this._clone) {
      const g = this._clone(m.root);
      g.userData.len = m.len;
      g.userData.walk = Math.random() * 6.28;
      return g;
    }
    if (kind === 'person') return this.buildPerson();
    if (kind === 'truck') return this.buildTruck();
    return this.buildCar(kind);
  }

  buildTruck() {
    const T = this.T;
    const g = new T.Group();
    const cabPaints = [0xf4f4f4, 0xc0392b, 0x2d5f8b, 0x1b1b20];
    const paint = cabPaints[Math.floor(Math.random() * cabPaints.length)];
    const glass = 0x27333d;
    const len = 4.3, wid = 1.06;

    // cab
    const cab = this.mesh(1.25, 0.95, wid, paint, len / 2 - 0.62, 0.2 + 0.475, 0);
    cab.castShadow = true;
    g.add(cab);
    g.add(this.mesh(0.1, 0.44, wid * 0.9, glass, len / 2 - 0.03, 0.86, 0));
    g.add(this.mesh(0.9, 0.3, wid * 0.82, glass, len / 2 - 0.66, 1.2, 0));
    // trailer, sitting a touch higher than the cab deck
    const trailer = this.mesh(2.75, 1.15, wid, 0xe9e9ea, -len / 2 + 1.45, 0.28 + 0.575, 0);
    trailer.castShadow = true;
    g.add(trailer);
    g.add(this.mesh(0.12, 0.9, wid * 0.94, 0xd4d4d6, -len / 2 + 0.06, 0.86, 0));
    g.add(this.mesh(2.4, 0.1, wid * 0.5, 0xd0d0d2, -len / 2 + 1.45, 1.44, 0));
    // lights
    g.add(this.mesh(0.08, 0.09, 0.22, 0xfff3c4, len / 2 - 0.01, 0.34, wid / 2 - 0.18));
    g.add(this.mesh(0.08, 0.09, 0.22, 0xfff3c4, len / 2 - 0.01, 0.34, -wid / 2 + 0.18));
    g.add(this.mesh(0.08, 0.09, 0.24, 0xd63b2f, -len / 2 + 0.02, 0.4, wid / 2 - 0.2));
    g.add(this.mesh(0.08, 0.09, 0.24, 0xd63b2f, -len / 2 + 0.02, 0.4, -wid / 2 + 0.2));

    const wz = wid / 2 + 0.02;
    for (const sx of [len / 2 - 0.55, -len / 2 + 0.7, -len / 2 + 1.5]) {
      for (const sz of [-wz, wz]) g.add(this.mesh(0.42, 0.4, 0.14, 0x141418, sx, 0.2, sz));
    }
    g.userData.len = len;
    return g;
  }

  buildPerson() {
    const g = new this.T.Group();
    const tops = [0xd63b2f, 0x2d5f8b, 0xe0a63c, 0x2f7d52, 0x7a4fb5, 0xf4f4f4];
    const legs = [0x23252b, 0x1b3a5c, 0x4a4a52];
    const skins = [0xf0c9a8, 0xd7a97f, 0x8d5a3b, 0xf6d9bd];
    const hairs = [0x3a2a1c, 0x141418, 0x8a5a2b, 0xb8942f];
    const top = tops[Math.floor(Math.random() * tops.length)];
    const leg = legs[Math.floor(Math.random() * legs.length)];
    const skin = skins[Math.floor(Math.random() * skins.length)];
    const hair = hairs[Math.floor(Math.random() * hairs.length)];

    const hip = new this.T.Group();
    hip.add(this.mesh(0.16, 0.34, 0.15, leg, 0, 0.17, -0.09));
    hip.add(this.mesh(0.16, 0.34, 0.15, leg, 0, 0.17, 0.09));
    g.add(hip);
    g.add(this.mesh(0.34, 0.4, 0.28, top, 0, 0.54, 0));
    g.add(this.mesh(0.09, 0.3, 0.09, top, 0, 0.55, -0.21));
    g.add(this.mesh(0.09, 0.3, 0.09, top, 0, 0.55, 0.21));
    g.add(this.mesh(0.26, 0.26, 0.24, skin, 0, 0.87, 0));
    g.add(this.mesh(0.28, 0.09, 0.26, hair, 0, 1.02, 0));
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    g.scale.setScalar(0.9 + Math.random() * 0.2);
    g.userData.len = 0.5;
    g.userData.walk = Math.random() * 6.28;
    return g;
  }

  buildCar(kind) {
    const T = this.T;
    const g = new T.Group();
    const paints = [0xf4f4f4, 0x1b1b20, 0xc0392b, 0x2d5f8b, 0x9aa0a6, 0x2f7d52];
    const paint = kind === 'cyber' ? 0xb9bfc6 : paints[Math.floor(Math.random() * paints.length)];
    const glass = 0x27333d;
    let len;

    if (kind === 'cyber') {
      len = 2.6;
      const shape = new T.Shape();
      shape.moveTo(-1.3, 0.1);
      shape.lineTo(1.3, 0.1);
      shape.lineTo(1.3, 0.34);
      shape.lineTo(0.42, 0.78);
      shape.lineTo(-0.62, 0.78);
      shape.lineTo(-1.3, 0.32);
      shape.closePath();
      const geo = new T.ExtrudeGeometry(shape, { depth: 0.98, bevelEnabled: false });
      geo.translate(0, 0, -0.49);
      const body = new T.Mesh(geo, this.mat(paint));
      body.castShadow = true;
      g.add(body);
      g.add(this.mesh(1.1, 0.16, 1.0, glass, -0.1, 0.6, 0));
      g.add(this.mesh(0.06, 0.06, 0.9, 0xfff3c4, 1.31, 0.26, 0));
      g.add(this.mesh(0.06, 0.06, 0.9, 0xd63b2f, -1.31, 0.26, 0));
    } else {
      const y = kind === 'my';
      len = y ? 1.95 : 1.8;
      const wid = y ? 0.94 : 0.86;
      const bh = y ? 0.3 : 0.26;
      const ch = y ? 0.34 : 0.26;
      const body = this.mesh(len, bh, wid, paint, 0, 0.16 + bh / 2, 0);
      body.castShadow = true;
      g.add(body);
      const cabin = this.mesh(len * (y ? 0.62 : 0.56), ch, wid * 0.92, paint, y ? -0.02 : -0.06, 0.16 + bh + ch / 2, 0);
      cabin.castShadow = true;
      g.add(cabin);
      g.add(this.mesh(len * (y ? 0.5 : 0.46), ch * 0.62, wid * 0.96, glass, y ? -0.02 : -0.06, 0.16 + bh + ch * 0.55, 0));
      g.add(this.mesh(0.1, 0.07, 0.2, 0xfff3c4, len / 2 - 0.02, 0.24, wid / 2 - 0.16));
      g.add(this.mesh(0.1, 0.07, 0.2, 0xfff3c4, len / 2 - 0.02, 0.24, -wid / 2 + 0.16));
      g.add(this.mesh(0.08, 0.07, 0.24, 0xd63b2f, -len / 2 + 0.02, 0.26, wid / 2 - 0.18));
      g.add(this.mesh(0.08, 0.07, 0.24, 0xd63b2f, -len / 2 + 0.02, 0.26, -wid / 2 + 0.18));
    }

    const wheelY = 0.14;
    const wx = len * 0.31;
    const wz = (kind === 'cyber' ? 0.98 : (kind === 'my' ? 0.94 : 0.86)) / 2 + 0.02;
    for (const sx of [-wx, wx]) {
      for (const sz of [-wz, wz]) {
        g.add(this.mesh(0.34, 0.28, 0.12, 0x141418, sx, wheelY, sz));
      }
    }
    g.userData.len = len;
    return g;
  }

  // ---------- traffic ----------

  loadTraffic() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(TRAFFIC_KEY) || 'null'); } catch (e) {}
    const list = Array.isArray(raw) ? raw : DEFAULT_TRAFFIC;
    const clean = [];
    for (const e of list) {
      if (!e || !KINDS[e.kind]) continue;
      clean.push({
        uid: 'l' + (this.uid = (this.uid || 0) + 1),
        kind: e.kind,
        speed: clamp(Number(e.speed) || 3, 0.4, 10),
        level: Math.round(clamp(Number(e.level) || 0, 0, 40)),
        often: clamp(Number(e.often) || 1, 0.1, 2),
        on: e.on !== false
      });
    }
    return clean.length ? clean : this.defaults();
  }

  defaults() {
    return DEFAULT_TRAFFIC.map((e) => Object.assign({ uid: 'l' + (this.uid = (this.uid || 0) + 1) }, e));
  }

  saveTraffic() {
    try {
      localStorage.setItem(TRAFFIC_KEY, JSON.stringify(this.traffic.map((e) => ({
        kind: e.kind, speed: e.speed, level: e.level, often: e.often, on: e.on
      }))));
    } catch (e) {}
  }

  // Weighted pick among the lanes that have reached their level.
  pickLane() {
    const at = Math.max(0, this.score || 0);
    const pool = this.traffic.filter((e) => e.on && e.level <= at);
    if (!pool.length) return null;
    let total = 0;
    for (const e of pool) total += Math.max(0.1, e.often);
    let r = Math.random() * total;
    for (const e of pool) { r -= Math.max(0.1, e.often); if (r <= 0) return e; }
    return pool[pool.length - 1];
  }

  // Rebuild the rows the player has not reached yet, so edits show up at once.
  applyTraffic() {
    this.saveTraffic();
    if (!this.scene || !this.rows) return;
    for (const [i, row] of this.rows) {
      if (i > this.prow + 1) { this.scene.remove(row.group); this.rows.delete(i); }
    }
  }

  // ---------- model slots in the panel ----------

  loadLook() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(LOOK_KEY) || 'null'); } catch (e) {}
    const out = {};
    for (const sl of SLOTS) {
      const v = (raw && raw[sl.id]) || {};
      out[sl.id] = { size: clamp(Number(v.size) || 1, 0.3, 3), yaw: clamp(Number(v.yaw) || 0, 0, 350) };
    }
    return out;
  }

  saveLook() {
    try { localStorage.setItem(LOOK_KEY, JSON.stringify(this.look)); } catch (e) {}
  }

  renderModels() {
    const box = $('edModels');
    if (!box) return;
    box.textContent = '';
    for (const slot of SLOTS) box.appendChild(this.slotCard(slot));
  }

  slotCard(slot) {
    const m = this.models[slot.id];
    const look = this.look[slot.id];
    const st = this.slotState[slot.id];
    const el = document.createElement('div');
    el.dataset.slot = slot.id;

    let state;
    let cls = 'slot';
    if (st && st.busy) { state = 'Reading\u2026'; cls += ' busy'; }
    else if (st && st.err) { state = st.err; cls += ' bad'; }
    else if (m) state = m.name + (m.bytes ? ' \u00b7 ' + niceSize(m.bytes) : '');
    else state = 'Built-in';
    el.className = cls;

    let html =
      '<div class="slot-top"><span class="slot-name">' + slot.label + '</span>' +
      '<span class="slot-state">' + state + '</span></div>' +
      '<div class="slot-btns">' +
        '<button class="icon-btn" data-mact="pick">' + (m ? 'Replace' : 'Upload .glb') + '</button>' +
        (m ? '<button class="icon-btn" data-mact="clear">Remove</button>' : '') +
      '</div>';
    if (m) {
      html += ctrlRow('size', 'Size', look.size, 0.3, 3, 0.05, fmt('size', look.size), 'mkey') +
              ctrlRow('yaw', 'Turn', look.yaw, 0, 350, 10, fmt('yaw', look.yaw), 'mkey');
    }
    el.innerHTML = html;
    return el;
  }

  onModelClick(ev) {
    const btn = ev.target.closest ? ev.target.closest('[data-mact]') : null;
    if (!btn) return;
    const id = btn.closest('.slot').dataset.slot;
    if (btn.dataset.mact === 'pick') {
      this.pickSlot = id;
      const input = $('edFile');
      input.value = '';
      input.click();
    } else if (btn.dataset.mact === 'clear') {
      this.slotState[id] = null;
      this.clearModel(id);
    }
  }

  onModelInput(ev) {
    const t = ev.target;
    const key = t.dataset.mkey;
    if (!key) return;
    const card = t.closest('.slot');
    const id = card.dataset.slot;
    this.look[id][key] = Number(t.value);
    const out = card.querySelector('[data-val="' + key + '"]');
    if (out) out.textContent = fmt(key, this.look[id][key]);
    this.saveLook();
    clearTimeout(this.lookT);
    this.lookT = setTimeout(() => this.reprepModel(id), 110);
  }

  async onModelFile(file) {
    const id = this.pickSlot;
    if (!id || !file) return;
    this.slotState[id] = { busy: true };
    this.renderModels();
    try {
      const buf = await file.arrayBuffer();
      await this.installModel(id, buf, file.name, file.size);
      this.slotState[id] = null;
    } catch (e) {
      console.warn('[game] could not read that model', e);
      this.slotState[id] = { err: 'Could not read that file' };
    }
    this.renderModels();
  }

  // ---------- editor ----------

  setEditor(open) {
    this.editing = !!open;
    $('editor').hidden = !this.editing;
    $('pencil').setAttribute('aria-expanded', this.editing ? 'true' : 'false');
    if (this.editing) { this.renderModels(); this.renderEditor(); }
    this.render();
  }

  renderEditor() {
    const list = $('edList');
    list.textContent = '';
    if (!this.traffic.length) {
      const empty = document.createElement('div');
      empty.className = 'ed-empty';
      empty.textContent = 'No lanes. The road is empty — add one below.';
      list.appendChild(empty);
      return;
    }
    for (const e of this.traffic) list.appendChild(this.laneCard(e));
  }

  laneCard(e) {
    const el = document.createElement('div');
    el.className = 'lane' + (e.on ? '' : ' off');
    el.dataset.uid = e.uid;
    const options = KIND_IDS.map((k) =>
      '<option value="' + k + '"' + (k === e.kind ? ' selected' : '') + '>' + KINDS[k].label + '</option>').join('');
    el.innerHTML =
      '<div class="lane-top">' +
        '<span class="swatch" style="background:' + KINDS[e.kind].swatch + '"></span>' +
        '<select class="lane-kind" data-act="kind" aria-label="Lane type">' + options + '</select>' +
        '<button class="icon-btn' + (e.on ? ' on' : '') + '" data-act="toggle">' + (e.on ? 'On' : 'Off') + '</button>' +
        '<button class="icon-btn" data-act="del" title="Remove lane">&#10005;</button>' +
      '</div>' +
      ctrlRow('speed', 'Speed', e.speed, 0.4, 10, 0.1, fmt('speed', e.speed)) +
      ctrlRow('level', 'From level', e.level, 0, 40, 1, fmt('level', e.level)) +
      ctrlRow('often', 'How often', e.often, 0.1, 2, 0.1, fmt('often', e.often));
    return el;
  }

  laneOf(node) {
    const card = node.closest ? node.closest('.lane') : null;
    if (!card) return null;
    return this.traffic.find((e) => e.uid === card.dataset.uid) || null;
  }

  onLaneInput(ev) {
    const t = ev.target;
    const entry = this.laneOf(t);
    if (!entry) return;
    if (t.dataset.act === 'kind') {
      entry.kind = KINDS[t.value] ? t.value : entry.kind;
      this.renderEditor();
      this.applyTraffic();
      return;
    }
    const key = t.dataset.key;
    if (!key) return;
    entry[key] = key === 'level' ? Math.round(Number(t.value)) : Number(t.value);
    const out = t.closest('.lane').querySelector('[data-val="' + key + '"]');
    if (out) out.textContent = fmt(key, entry[key]);
    clearTimeout(this.applyT);
    this.applyT = setTimeout(() => this.applyTraffic(), 140);
  }

  onLaneClick(ev) {
    const btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!btn || btn.dataset.act === 'kind') return;
    const entry = this.laneOf(btn);
    if (!entry) return;
    if (btn.dataset.act === 'toggle') entry.on = !entry.on;
    else if (btn.dataset.act === 'del') this.traffic = this.traffic.filter((e) => e !== entry);
    this.renderEditor();
    this.applyTraffic();
  }

  addLane() {
    this.traffic.push({ uid: 'l' + (this.uid = (this.uid || 0) + 1), kind: 'm3', speed: 3, level: 0, often: 1, on: true });
    this.renderEditor();
    $('edList').lastElementChild.scrollIntoView({ block: 'nearest' });
    this.applyTraffic();
  }

  resetTraffic() {
    this.traffic = this.defaults();
    this.renderEditor();
    this.applyTraffic();
  }

  // How far to slide the world so the character stays clear of the panel.
  panTarget() {
    if (!this.editing || !this.camera) return { x: 0, y: 0 };
    const r = $('editor').getBoundingClientRect();
    const w = this.host.clientWidth || 1;
    const h = this.host.clientHeight || 1;
    if (r.width >= w * 0.9) return { x: 0, y: -(r.height / h) * this.camera.top * 0.85 };
    return { x: (r.width / w) * this.camera.right * 0.85, y: 0 };
  }

  // ---------- input ----------

  key(e) {
    const k = e.key;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
      if (k === 'Escape') { e.target.blur(); this.setEditor(false); }
      return;
    }
    if (k === 'e' || k === 'E') { e.preventDefault(); this.setEditor(!this.editing); return; }
    if (this.editing) {
      if (k === 'Escape') { e.preventDefault(); this.setEditor(false); }
      return;
    }
    const phase = this.state.phase;
    if (phase === 'ready' || phase === 'over') {
      if (k === ' ' || k === 'Enter' || k === 'r' || k === 'R' || k === 'ArrowUp' || k === 'w' || k === 'W') {
        e.preventDefault();
        this.play();
      }
      return;
    }
    if (phase !== 'play') return;
    let dx = 0, dz = 0;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') dz = 1;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') dz = -1;
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') dx = -1;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') dx = 1;
    else return;
    e.preventDefault();
    this.hop(dx, dz);
  }

  bindTouch() {
    const el = this.renderer.domElement;
    let sx = 0, sy = 0, t0 = 0;
    el.addEventListener('pointerdown', (e) => { if (this.editing) return; sx = e.clientX; sy = e.clientY; t0 = Date.now(); });
    el.addEventListener('pointerup', (e) => {
      if (this.editing) return;
      if (this.state.phase !== 'play') { this.play(); return; }
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Date.now() - t0 < 500 && Math.abs(dx) < 24 && Math.abs(dy) < 24) { this.hop(0, 1); return; }
      if (Math.abs(dx) > Math.abs(dy)) this.hop(dx > 0 ? 1 : -1, 0);
      else this.hop(0, dy < 0 ? 1 : -1);
    });
  }

  play() {
    if (this.state.phase === 'loading' || this.state.phase === 'error') return;
    this.reset();
    this.setState({ phase: 'play', score: 0 });
  }

  hop(dx, dz) {
    if (this.hopT !== null) return;
    const nx = this.px + dx;
    const nrow = this.prow + dz;
    if (nx < -COLS || nx > COLS) return;
    if (nrow < this.score - 5) return;
    const row = this.rows.get(nrow);
    if (row && row.blockers.has(nx)) return;
    this.from = { x: this.px, r: this.prow };
    this.to = { x: nx, r: nrow };
    this.px = nx;
    this.prow = nrow;
    this.hopT = 0;
    this.face = dx !== 0 ? (dx > 0 ? Math.PI / 2 : -Math.PI / 2) : (dz > 0 ? 0 : Math.PI);
    this.beep(520, 0.07, 'square', 0.05);
    if (nrow > this.score) {
      this.score = nrow;
      this.setState({ score: nrow });
      if (nrow % 10 === 0) this.beep(760, 0.1, 'triangle', 0.05);
    }
  }

  // ---------- loop ----------

  loop() {
    this.raf = requestAnimationFrame(() => this.loop());
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    const playing = this.state.phase === 'play' && !this.editing;

    // Stream rows in every frame, not just while playing: a resize or an orientation
    // change widens the view and would otherwise leave bare sky at the edges.
    for (let i = this.prow - this.behind; i <= this.prow + this.ahead; i++) this.buildRow(i);
    for (const [i, row] of this.rows) {
      if (i < this.prow - this.behind - 2) { this.scene.remove(row.group); this.rows.delete(i); }
    }

    this.clock = (this.clock || 0) + dt;
    for (const row of this.rows.values()) {
      if (row.type !== 'road') continue;
      const speed = playing ? row.speed : row.speed * 0.35;
      const walking = row.kind === 'person';
      for (const car of row.cars) {
        car.position.x += row.dir * speed * dt;
        if (walking) car.position.y = Math.abs(Math.sin(this.clock * 5 + car.userData.walk)) * 0.07;
        const lim = this.lim + 2;
        if (row.dir > 0 && car.position.x > lim) car.position.x = -lim - Math.random() * 3;
        else if (row.dir < 0 && car.position.x < -lim) car.position.x = lim + Math.random() * 3;
      }
    }

    if (this.hopT !== null) {
      this.hopT += (dt * 1000) / HOP_MS;
      const t = Math.min(1, this.hopT);
      const e = t * t * (3 - 2 * t);
      const x = this.from.x + (this.to.x - this.from.x) * e;
      const z = -(this.from.r + (this.to.r - this.from.r) * e);
      this.player.position.set(x, 0.08 + Math.sin(t * Math.PI) * 0.42, z);
      const sq = 1 + Math.sin(t * Math.PI) * 0.12;
      this.rig.scale.set(1 / sq, sq, 1 / sq);
      this.rig.rotation.z = Math.sin(t * Math.PI) * 0.12 * (this.to.x < this.from.x ? 1 : this.to.x > this.from.x ? -1 : 0);
      if (t >= 1) { this.hopT = null; this.rig.scale.set(1, 1, 1); }
    }

    if (this.rig && this.state.phase !== 'over') {
      this.rig.rotation.y = lerpAngle(this.rig.rotation.y, this.camFace + this.face, 0.35);
    }

    this.stepDeath(dt);
    this.stepSplatter(dt);

    if (playing) this.checkHit();
    this.syncCamera(playing ? 0.12 : 0.06);
    if (this.mixer) this.mixer.update(dt);
    this.renderer.render(this.scene, this.camera);
  }

  checkHit() {
    const row = this.rows.get(this.prow);
    if (!row || row.type !== 'road') return;
    const px = this.player.position.x;
    for (const car of row.cars) {
      const half = car.userData.len / 2 + 0.32;
      if (Math.abs(car.position.x - px) < half) { this.crash(car, row.dir); return; }
    }
  }

  crash(car, dir) {
    this.beep(150, 0.32, 'sawtooth', 0.09);
    setTimeout(() => this.beep(90, 0.4, 'sawtooth', 0.07), 90);
    this.hopT = null;
    // Knocked the way the car was going, then flattened on the tarmac.
    this.deathT = 0;
    this.deathDir = dir || 1;
    this.deathFrom = { x: this.player.position.x, y: this.player.position.y, z: this.player.position.z };
    this.deathTilt = this.rig.rotation.z;
    this.spawnSplatter(this.player.position, this.deathDir);
    if (this.score > this.best) {
      this.best = this.score;
      try { localStorage.setItem('crossyTeslaBest', String(this.best)); } catch (e) {}
    }
    this.setState({ phase: 'over', best: this.best });
  }

  // ---------- wreckage ----------

  spawnSplatter(at, dir) {
    const T = this.T;
    const reds = [0xd63b2f, 0xb42b22, 0xe8574a, 0x8f1f19];
    const sizes = [0.09, 0.13, 0.18];
    this.splatter = this.splatter || [];
    for (let i = 0; i < SPLATS; i++) {
      const sz = sizes[Math.floor(Math.random() * sizes.length)];
      const m = this.mesh(sz, sz, sz, reds[Math.floor(Math.random() * reds.length)], 0, 0, 0);
      m.castShadow = true;
      m.position.set(
        at.x + (Math.random() - 0.5) * 0.3,
        0.35 + Math.random() * 0.7,
        at.z + (Math.random() - 0.5) * 0.3
      );
      m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      this.scene.add(m);
      this.splatter.push({
        mesh: m,
        vel: new T.Vector3(
          dir * (1.3 + Math.random() * 3.4) + (Math.random() - 0.5) * 2.2,
          2.6 + Math.random() * 3.6,
          (Math.random() - 0.5) * 3.0
        ),
        spin: new T.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
        rest: 0.008 + Math.random() * 0.014,
        down: false
      });
    }
    // A pool that is there from the first frame, so the hit always leaves a mark.
    for (let i = 0; i < 14; i++) {
      const sz = 0.12 + Math.random() * 0.26;
      const m = this.mesh(0.18, 0.18, 0.18, reds[Math.floor(Math.random() * reds.length)], 0, 0, 0);
      m.position.set(at.x + (Math.random() - 0.5) * 1.5, this.groundY(at.z) + 0.006 + i * 0.001, at.z + (Math.random() - 0.5) * 1.1);
      m.rotation.set(0, Math.random() * Math.PI, 0);
      m.scale.set(sz / 0.18, 0.1, sz / 0.18);
      this.scene.add(m);
      this.splatter.push({ mesh: m, vel: new T.Vector3(), spin: new T.Vector3(), rest: 0, down: true });
    }
  }

  // Top of the ground slab for a world z: grass rows sit higher than roads.
  groundY(z) {
    const row = this.rows.get(Math.round(-z));
    return row && row.type === 'grass' ? 0.08 : 0;
  }

  stepSplatter(dt) {
    if (!this.splatter || !this.splatter.length) return;
    for (const p of this.splatter) {
      if (p.down) continue;
      p.vel.y -= GRAVITY * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.rotation.x += p.spin.x * dt;
      p.mesh.rotation.y += p.spin.y * dt;
      p.mesh.rotation.z += p.spin.z * dt;
      const rest = this.groundY(p.mesh.position.z) + p.rest;
      if (p.mesh.position.y <= rest) {
        // Land as a flat smear on the ground instead of a floating cube.
        p.mesh.position.y = rest;
        p.mesh.rotation.set(0, Math.random() * Math.PI, 0);
        p.mesh.scale.set(1 + Math.random() * 0.9, 0.16, 1 + Math.random() * 0.9);
        p.mesh.castShadow = false;
        p.down = true;
      }
    }
  }

  clearSplatter() {
    if (!this.splatter) { this.splatter = []; return; }
    for (const p of this.splatter) this.scene.remove(p.mesh);
    this.splatter.length = 0;
  }

  stepDeath(dt) {
    if (this.deathT === null || this.deathT === undefined) return;
    this.deathT = Math.min(1, this.deathT + (dt * 1000) / FALL_MS);
    const t = this.deathT;
    const e = t * t * (3 - 2 * t);
    const d = this.deathFrom;
    // shoved along the road, a short pop into the air, then down
    this.player.position.set(
      d.x + this.deathDir * 1.35 * e,
      Math.max(0.02, d.y + Math.sin(t * Math.PI) * 0.45 - e * d.y),
      d.z + (Math.random() - 0.5) * 0.004 * (1 - t)
    );
    this.rig.rotation.z = this.deathTilt + (-this.deathDir * Math.PI / 2 - this.deathTilt) * e;
    this.rig.scale.set(1 + 0.34 * e, 1 - 0.62 * e, 1 + 0.34 * e);
  }

  syncCamera(k) {
    const p = this.player.position;
    this.camAim.x += (p.x * 0.85 - this.camAim.x) * k;
    this.camAim.z += (p.z - 1.8 - this.camAim.z) * k;
    this.camera.position.set(this.camAim.x + this.camOff.x, this.camOff.y, this.camAim.z + this.camOff.z);
    this.camera.lookAt(this.camAim.x, 0, this.camAim.z);

    // Keep the character out from behind the editor panel.
    const want = this.panTarget();
    this.pan.x += (want.x - this.pan.x) * 0.14;
    this.pan.y += (want.y - this.pan.y) * 0.14;
    if (Math.abs(this.pan.x) > 0.001 || Math.abs(this.pan.y) > 0.001) {
      this.camera.updateMatrix();
      this._right = this._right || new this.T.Vector3();
      this._up = this._up || new this.T.Vector3();
      this._right.setFromMatrixColumn(this.camera.matrix, 0);
      this._up.setFromMatrixColumn(this.camera.matrix, 1);
      this.camera.position.addScaledVector(this._right, this.pan.x).addScaledVector(this._up, this.pan.y);
    }
    if (this.sun) {
      this.sun.position.set(this.camAim.x + 9, 18, this.camAim.z + 8);
      this.sun.target.position.set(this.camAim.x, 0, this.camAim.z);
      this.sun.target.updateMatrixWorld();
    }
  }

  resize() {
    if (!this.renderer || !this.host) return;
    const w = this.host.clientWidth || window.innerWidth;
    const h = this.host.clientHeight || window.innerHeight;
    this.renderer.setSize(w, h, false);
    const f = frustum(w, h);
    this.behind = f.behind;
    this.ahead = f.ahead;
    this.lim = f.lim;
    this.camera.left = -f.dx;
    this.camera.right = f.dx;
    this.camera.top = f.dy;
    this.camera.bottom = -f.dy;
    this.camera.updateProjectionMatrix();
  }

  beep(freq, dur, type, gain) {
    try {
      if (!this.actx) this.actx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.actx;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = gain || 0.05;
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g).connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }
}

window.__game = new Game();
</script>
</body>
</html>
