<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>GLASS JAW — Championship Boxing</title>
<meta name="description" content="A modern high-resolution arcade boxing game. Read the tell, slip the punch, make them pay." />
<meta name="theme-color" content="#0a0810" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23140d20'/%3E%3Ccircle cx='32' cy='34' r='17' fill='%23ffd166'/%3E%3Ccircle cx='26' cy='28' r='6' fill='%23fff' opacity='.55'/%3E%3Cpath d='M15 30a17 17 0 0 1 34 0' stroke='%23ff6b35' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #06040a; color: #f4eee6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: block; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
    text-align: center; background: #06040a; z-index: 10; transition: opacity .45s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 {
    font: 900 clamp(38px, 9vw, 104px)/0.92 Impact, "Arial Black", system-ui, sans-serif;
    letter-spacing: .04em; margin: 0;
    background: linear-gradient(180deg, #fff 0%, #ffd166 52%, #ff6b35 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 6px 26px rgba(255,140,40,.28);
  }
  #boot p { margin: 0; opacity: .75; font-size: clamp(13px, 2.4vw, 17px); letter-spacing: .18em; text-transform: uppercase; }
  #boot .err { color: #ff6b6b; max-width: min(700px, 88vw); text-align: left; white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0; text-transform: none; }
  .spin { width: 34px; height: 34px; margin: 0 auto; border: 3px solid rgba(255,209,102,.25);
    border-top-color: #ffd166; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <h1>GLASS JAW</h1>
    <div class="spin" id="spin"></div>
    <p id="bootmsg">Taping up…</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
